[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mingolf-cli"
version = "0.1.0"
description = "AI-agent-first CLI for mingolf.golf.se"
readme = {text = "Mingolf command-line client.", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
  "click>=8.0.0",
  "httpx>=0.27.0",
  "keyring>=25.2.0",
  # Fallback keyring backend. On headless/container hosts there is no D-Bus
  # secret service, so keyring resolves to fail.Keyring and every password read
  # raises keyring_read_failed. keyrings.alt's PlaintextKeyring (priority 0.5)
  # fills that gap; on desktop hosts the native backend (priority >= 5) still
  # wins, so this only takes effect where nothing better exists.
  "keyrings.alt>=5.0.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
mingolf = "mingolf_cli.main:run"

[tool.setuptools]
packages = ["mingolf_cli", "mingolf_cli.client", "mingolf_cli.commands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
